name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/app/static

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build backend executable
        run: |
          cd backend
          cat > raven.spec << 'EOF'
# -*- mode: python ; coding: utf-8 -*-

block_cipher = None

a = Analysis(
    ['app/main.py'],
    pathex=['.'],
    binaries=[],
    datas=[
        ('app/static', 'app/static'),
        ('app/templates', 'app/templates'),
        ('alembic', 'alembic'),
        ('alembic.ini', '.'),
        ('.env.example', '.'),
    ],
    hiddenimports=[
        'uvicorn.logging',
        'uvicorn.loops',
        'uvicorn.loops.auto',
        'uvicorn.protocols',
        'uvicorn.protocols.http',
        'uvicorn.protocols.http.auto',
        'uvicorn.protocols.websockets',
        'uvicorn.protocols.websockets.auto',
        'uvicorn.lifespan',
        'uvicorn.lifespan.on',
        'uvicorn.lifespan.off',
        'sqlalchemy.dialects.postgresql.asyncpg',
        'pydantic_core._pydantic_core',
        'passlib.handlers.bcrypt',
        'jose.backends.cryptography_backend',
        'redis.asyncio',
        'celery',
        'celery.app.trace',
        'celery.worker',
        'celery.worker.strategy',
        'celery.worker.consumer',
        'celery.worker.request',
        'celery.worker.control',
        'celery.bootsteps',
        'celery.platforms',
        'celery.signals',
        'celery.utils.log',
        'celery.utils.collections',
        'celery.utils.time',
        'celery.utils.functional',
        'celery.utils.imports',
        'celery.utils.text',
        'celery.utils.uuid',
        'celery.utils.debug',
        'celery.utils.threads',
        'celery.utils.serialization',
        'celery.utils.encoding',
        'celery.utils.term',
        'celery.utils.limits',
        'celery.utils.objects',
        'celery.utils.nodenames',
        'celery.utils.graph',
        'celery.utils.dispatch',
        'celery.utils.timeutils',
        'celery.utils.os',
        'celery.utils.net',
        'celery.utils.alias',
        'celery.utils.compat',
        'celery.utils.inspect',
        'celery.utils.sysinfo',
        'celery.utils.iso8601',
        'ollama',
        'pandas',
        'numpy',
        'httpx',
        'structlog',
        'python_json_logger',
        'email_validator',
        'dateutil',
        'dateutil.parser',
        'dateutil.tz',
        'dateutil.relativedelta',
    ],
    hookspath=[],
    hooksconfig={},
    runtime_hooks=[],
    excludes=[
        'pytest',
        'mypy',
        'ruff',
        'vitest',
        'playwright',
        'eslint',
        'typescript',
        'vite',
        'tailwindcss',
        'postcss',
        'autoprefixer',
    ],
    win_no_prefer_redirects=False,
    win_private_assemblies=False,
    cipher=block_cipher,
    noarchive=False,
)

pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

exe = EXE(
    pyz,
    a.scripts,
    a.binaries,
    a.zipfiles,
    a.datas,
    [],
    name='raven',
    debug=False,
    bootloader_ignore_signals=False,
    strip=False,
    upx=True,
    upx_exclude=[],
    runtime_tmpdir=None,
    console=True,
    disable_windowed_traceback=False,
    argv_emulation=False,
    target_arch=None,
    codesign_identity=None,
    entitlements_file=None,
    icon=None,
)
EOF

      - name: Run PyInstaller
        run: |
          cd backend
          pyinstaller --clean raven.spec

      - name: Upload backend executable
        uses: actions/upload-artifact@v4
        with:
          name: raven-executable
          path: backend/dist/raven
          retention-days: 7

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/app/static

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        run: |
          cd backend
          cat > raven.spec << 'EOF'
# -*- mode: python ; coding: utf-8 -*-

block_cipher = None

a = Analysis(
    ['app/main.py'],
    pathex=['.'],
    binaries=[],
    datas=[
        ('app/static', 'app/static'),
        ('app/templates', 'app/templates'),
        ('alembic', 'alembic'),
        ('alembic.ini', '.'),
        ('.env.example', '.'),
    ],
    hiddenimports=[
        'uvicorn.logging',
        'uvicorn.loops',
        'uvicorn.loops.auto',
        'uvicorn.protocols',
        'uvicorn.protocols.http',
        'uvicorn.protocols.http.auto',
        'uvicorn.protocols.websockets',
        'uvicorn.protocols.websockets.auto',
        'uvicorn.lifespan',
        'uvicorn.lifespan.on',
        'uvicorn.lifespan.off',
        'sqlalchemy.dialects.postgresql.asyncpg',
        'pydantic_core._pydantic_core',
        'passlib.handlers.bcrypt',
        'jose.backends.cryptography_backend',
        'redis.asyncio',
        'celery',
        'celery.app.trace',
        'celery.worker',
        'celery.worker.strategy',
        'celery.worker.consumer',
        'celery.worker.request',
        'celery.worker.control',
        'celery.bootsteps',
        'celery.platforms',
        'celery.signals',
        'celery.utils.log',
        'celery.utils.collections',
        'celery.utils.time',
        'celery.utils.functional',
        'celery.utils.imports',
        'celery.utils.text',
        'celery.utils.uuid',
        'celery.utils.debug',
        'celery.utils.threads',
        'celery.utils.serialization',
        'celery.utils.encoding',
        'celery.utils.term',
        'celery.utils.limits',
        'celery.utils.objects',
        'celery.utils.nodenames',
        'celery.utils.graph',
        'celery.utils.dispatch',
        'celery.utils.timeutils',
        'celery.utils.os',
        'celery.utils.net',
        'celery.utils.alias',
        'celery.utils.compat',
        'celery.utils.inspect',
        'celery.utils.sysinfo',
        'celery.utils.iso8601',
        'ollama',
        'pandas',
        'numpy',
        'httpx',
        'structlog',
        'python_json_logger',
        'email_validator',
        'dateutil',
        'dateutil.parser',
        'dateutil.tz',
        'dateutil.relativedelta',
    ],
    hookspath=[],
    hooksconfig={},
    runtime_hooks=[],
    excludes=[
        'pytest',
        'mypy',
        'ruff',
        'vitest',
        'playwright',
        'eslint',
        'typescript',
        'vite',
        'tailwindcss',
        'postcss',
        'autoprefixer',
    ],
    win_no_prefer_redirects=False,
    win_private_assemblies=False,
    cipher=block_cipher,
    noarchive=False,
)

pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

exe = EXE(
    pyz,
    a.scripts,
    a.binaries,
    a.zipfiles,
    a.datas,
    [],
    name='raven',
    debug=False,
    bootloader_ignore_signals=False,
    strip=False,
    upx=True,
    upx_exclude=[],
    runtime_tmpdir=None,
    console=True,
    disable_windowed_traceback=False,
    argv_emulation=False,
    target_arch=None,
    codesign_identity=None,
    entitlements_file=None,
    icon=None,
)
EOF

      - name: Run PyInstaller
        run: |
          cd backend
          pyinstaller --clean raven.spec

      - name: Create launcher
        run: |
          @echo off
          title RAVEN - Security Assessment Platform
          echo.
          echo ========================================
          echo   RAVEN Security Assessment Platform
          echo ========================================
          echo.
          echo Starting backend server...
          echo.
          REM Check if database is accessible
          echo Checking database connection...
          REM Start the backend
          raven.exe
          pause
        shell: cmd
        working-directory: backend/dist
        # This is handled by the next step instead

      - name: Create distribution package
        run: |
          $distDir = "dist-windows"
          if (Test-Path $distDir) { Remove-Item $distDir -Recurse -Force }
          New-Item -ItemType Directory -Path $distDir
          
          # Copy executable
          Copy-Item "backend/dist/raven.exe" "$distDir/"
          
          # Create launcher
          @"
          @echo off
          title RAVEN - Security Assessment Platform
          echo.
          echo ========================================
          echo   RAVEN Security Assessment Platform
          echo ========================================
          echo.
          echo Starting backend server...
          echo.
          REM Check if database is accessible
          echo Checking database connection...
          REM Start the backend
          raven.exe
          pause
          "@ | Set-Content "$distDir/start_raven.bat" -Encoding ASCII
          
          # Create shortcut script
          @"
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\RAVEN.lnk")
          $Shortcut.TargetPath = "$PSScriptRoot\start_raven.bat"
          $Shortcut.WorkingDirectory = "$PSScriptRoot"
          $Shortcut.Description = "RAVEN Security Assessment Platform"
          $Shortcut.Save()
          "@ | Set-Content "$distDir/create_shortcut.ps1" -Encoding UTF8
          
          # Copy config template
          Copy-Item "backend/.env.example" "$distDir/.env"
          Copy-Item "backend/alembic.ini" "$distDir/"
          Copy-Item "backend/alembic" "$distDir/alembic" -Recurse
          
          Compress-Archive -Path "$distDir/*" -DestinationPath "raven-windows-${{ github.ref_name }}.zip" -Force
        shell: pwsh

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: raven-windows
          path: dist-windows/raven-windows-${{ github.ref_name }}.zip
          retention-days: 7

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, docker]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: raven-windows
          path: dist

      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: raven-executable
          path: dist/linux

      - name: Create release package
        run: |
          cd dist
          mv linux/raven raven-linux-${{ github.ref_name }}
          chmod +x raven-linux-${{ github.ref_name }}
          gzip raven-linux-${{ github.ref_name }}
          
          # Create checksums
          sha256sum raven-windows-${{ github.ref_name }}.zip > checksums.txt
          sha256sum raven-linux-${{ github.ref_name }}.gz >> checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/raven-windows-${{ github.ref_name }}.zip
            dist/raven-linux-${{ github.ref_name }}.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: pip install mkdocs mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
