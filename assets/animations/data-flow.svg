<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d5a80" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4ecdc4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3d5a80" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3d5a80" opacity="0.6"/>
    </marker>
  </defs>

  <rect width="700" height="200" fill="#0a0f0a"/>
  <g stroke="#152515" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="700" y2="0" /><line x1="0" y1="100" x2="700" y2="100" />
    <line x1="0" y1="200" x2="700" y2="200" />
  </g>

  <rect x="15" y="12" width="670" height="26" fill="#1a3a2a" rx="4" opacity="0.5"/>
  <text class="mono" x="350" y="30" fill="#3d5a80" font-size="12" font-weight="600" text-anchor="middle">VULNERABILITY INTELLIGENCE PIPELINE</text>

  <g transform="translate(0, 40)">
    <rect class="stage" x="25" y="30" width="130" height="90" fill="#0d180d" stroke="#1a3a2a" stroke-width="1.5" rx="10">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="2.5s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
    <text class="mono" x="90" y="58" fill="#c9d1d9" font-size="11" font-weight="600" text-anchor="middle">INGEST</text>
    <text class="mono" x="90" y="74" fill="#5c6b73" font-size="9" text-anchor="middle">Nmap / ZAP / httpx</text>
    <text class="mono" x="90" y="96" fill="#3d5a80" font-size="10" font-weight="600" text-anchor="middle">2,847 req/s</text>
    <circle cx="90" cy="128" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>

    <line x1="155" y1="75" x2="190" y2="75" stroke="url(#pipeGrad)" stroke-width="3" fill="none" opacity="0.25" marker-end="url(#arrow)">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </line>

    <rect x="200" y="30" width="130" height="90" fill="#0d180d" stroke="#1a3a2a" stroke-width="1.5" rx="10">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="2.5s" repeatCount="indefinite" additive="sum" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
    <text class="mono" x="265" y="58" fill="#c9d1d9" font-size="11" font-weight="600" text-anchor="middle">NORMALIZE</text>
    <text class="mono" x="265" y="74" fill="#5c6b73" font-size="9" text-anchor="middle">Parse → Validate → Schema</text>
    <text class="mono" x="265" y="96" fill="#3d5a80" font-size="10" font-weight="600" text-anchor="middle">1,923 obj/s</text>
    <circle cx="265" cy="128" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite" begin="0.6s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>

    <line x1="330" y1="75" x2="365" y2="75" stroke="url(#pipeGrad)" stroke-width="3" fill="none" opacity="0.25" marker-end="url(#arrow)">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </line>

    <rect x="375" y="30" width="150" height="90" fill="#0d180d" stroke="#1a3a2a" stroke-width="1.5" rx="10">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="1s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="2.5s" repeatCount="indefinite" additive="sum" begin="1s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
    <text class="mono" x="450" y="58" fill="#c9d1d9" font-size="11" font-weight="600" text-anchor="middle">CORRELATE</text>
    <text class="mono" x="450" y="74" fill="#5c6b73" font-size="9" text-anchor="middle">CVE / KEV / EPSS / ATT&amp;CK</text>
    <text class="mono" x="450" y="96" fill="#3d5a80" font-size="10" font-weight="600" text-anchor="middle">94.2% match</text>
    <circle cx="450" cy="128" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite" begin="1.2s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>

    <line x1="525" y1="75" x2="560" y2="75" stroke="url(#pipeGrad)" stroke-width="3" fill="none" opacity="0.25" marker-end="url(#arrow)">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </line>

    <rect x="570" y="30" width="115" height="90" fill="#0d180d" stroke="#1a3a2a" stroke-width="1.5" rx="10">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="1.5s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="2.5s" repeatCount="indefinite" additive="sum" begin="1.5s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </rect>
    <text class="mono" x="627" y="58" fill="#c9d1d9" font-size="11" font-weight="600" text-anchor="middle">RISK SCORE</text>
    <text class="mono" x="627" y="74" fill="#5c6b73" font-size="9" text-anchor="middle">CVSS + EPSS + KEV</text>
    <text class="mono" x="627" y="96" fill="#3d5a80" font-size="10" font-weight="600" text-anchor="middle">8.7 / 10</text>
    <circle cx="627" cy="128" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite" begin="1.8s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
  </g>

  <g>
    <circle r="4" fill="#3d5a80" filter="url(#glow)">
      <animateMotion path="M 155 75 L 560 75" dur="5s" repeatCount="indefinite" rotate="auto">
        <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#3d5a80" filter="url(#glow)">
      <animateMotion path="M 155 75 L 560 75" dur="5s" repeatCount="indefinite" begin="1.25s" rotate="auto">
        <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#3d5a80" filter="url(#glow)">
      <animateMotion path="M 155 75 L 560 75" dur="5s" repeatCount="indefinite" begin="2.5s" rotate="auto">
        <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#3d5a80" filter="url(#glow)">
      <animateMotion path="M 155 75 L 560 75" dur="5s" repeatCount="indefinite" begin="3.75s" rotate="auto">
        <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/>
      </animateMotion>
    </circle>
  </g>

  <rect x="25" y="162" width="650" height="26" fill="#1a3a2a" rx="6" opacity="0.5"/>
  <text class="mono" x="350" y="180" fill="#5c6b73" font-size="9" text-anchor="middle">THROUGHPUT: 2,847 events/sec  •  LATENCY (p99): 14ms  •  ERROR RATE: 0.018%  •  QUEUE: 12 pending</text>
</svg>
