<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081208"/>
      <stop offset="100%" stop-color="#0a0f0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="520" height="260" fill="url(#bgGrad)"/>
  <g stroke="#152515" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="0" x2="520" y2="0" /><line x1="0" y1="65" x2="520" y2="65" />
    <line x1="0" y1="130" x2="520" y2="130" /><line x1="0" y1="195" x2="520" y2="195" />
    <line x1="0" y1="260" x2="520" y2="260" />
    <line x1="0" y1="0" x2="0" y2="260" /><line x1="130" y1="0" x2="130" y2="260" />
    <line x1="260" y1="0" x2="260" y2="260" /><line x1="390" y1="0" x2="390" y2="260" />
    <line x1="520" y1="0" x2="520" y2="260" />
  </g>

  <rect x="10" y="10" width="500" height="28" fill="#1a3a2a" rx="4" opacity="0.6"/>
  <text class="mono" x="260" y="29" fill="#3d5a80" font-size="11" font-weight="600" text-anchor="middle">NETWORK RECONNAISSANCE</text>

  <g transform="translate(260,130)">
    <circle r="45" stroke="#3d5a80" stroke-width="1.5" fill="none" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="75" stroke="#3d5a80" stroke-width="1.5" fill="none" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="105" stroke="#3d5a80" stroke-width="1.5" fill="none" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="20" x2="0" y2="110" stroke="#3d5a80" stroke-width="1.5" opacity="0.7" transform="rotate(-90)">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <circle r="7" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <circle r="16" stroke="#3d5a80" stroke-width="1.5" fill="none" opacity="0.4" />
    <circle r="26" stroke="#3d5a80" stroke-width="0.8" fill="none" opacity="0.2" />
    <circle r="36" stroke="#3d5a80" stroke-width="0.5" fill="none" opacity="0.1" />
  </g>

  <g>
    <line x1="260" y1="130" x2="100" y2="55" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="100" cy="55" r="5" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite" begin="0.2s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="0.2s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <text class="mono" x="100" y="40" fill="#c9d1d9" font-size="10" text-anchor="middle">10.0.1.5</text>
    <text class="mono" x="100" y="68" fill="#5c6b73" font-size="8" text-anchor="middle">HTTP/SSH</text>

    <line x1="260" y1="130" x2="420" y2="55" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="420" cy="55" r="5" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <text class="mono" x="420" y="40" fill="#c9d1d9" font-size="10" text-anchor="middle">192.168.1.10</text>
    <text class="mono" x="420" y="68" fill="#5c6b73" font-size="8" text-anchor="middle">RDP/SMB</text>

    <line x1="260" y1="130" x2="100" y2="205" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="100" cy="205" r="5" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite" begin="0.8s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="0.8s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <text class="mono" x="100" y="190" fill="#c9d1d9" font-size="10" text-anchor="middle">172.16.0.3</text>
    <text class="mono" x="100" y="218" fill="#5c6b73" font-size="8" text-anchor="middle">PostgreSQL</text>

    <line x1="260" y1="130" x2="420" y2="205" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="420" cy="205" r="5" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite" begin="1.1s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="1.1s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <text class="mono" x="420" y="190" fill="#c9d1d9" font-size="10" text-anchor="middle">10.10.0.7</text>
    <text class="mono" x="420" y="218" fill="#5c6b73" font-size="8" text-anchor="middle">LDAP/DNS</text>

    <line x1="260" y1="130" x2="160" y2="80" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="160" cy="80" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" begin="1.4s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="1.4s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <line x1="260" y1="130" x2="360" y2="80" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="360" cy="80" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" begin="1.6s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="1.6s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <line x1="260" y1="130" x2="160" y2="180" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="160" cy="180" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" begin="1.8s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="1.8s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
    <line x1="260" y1="130" x2="360" y2="180" stroke="#3d5a80" stroke-width="0.6" opacity="0.2" stroke-dasharray="6 6"/>
    <circle cx="360" cy="180" r="4" fill="#3d5a80" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" begin="2.0s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" begin="2.0s" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    </circle>
  </g>

  <circle cx="260" cy="130" r="3.5" fill="#3d5a80" filter="url(#glow)">
    <animateMotion path="M 260 130 Q 180 90 100 55" dur="4s" repeatCount="indefinite" rotate="auto">
      <animate attributeName="opacity" values="1;0" dur="4s" repeatCount="indefinite"/>
    </animateMotion>
  </circle>
  <circle cx="260" cy="130" r="3.5" fill="#3d5a80" filter="url(#glow)">
    <animateMotion path="M 260 130 Q 340 90 420 55" dur="4s" repeatCount="indefinite" begin="1.3s" rotate="auto">
      <animate attributeName="opacity" values="1;0" dur="4s" repeatCount="indefinite"/>
    </animateMotion>
  </circle>
  <circle cx="260" cy="130" r="3.5" fill="#3d5a80" filter="url(#glow)">
    <animateMotion path="M 260 130 Q 180 170 100 205" dur="4s" repeatCount="indefinite" begin="2.6s" rotate="auto">
      <animate attributeName="opacity" values="1;0" dur="4s" repeatCount="indefinite"/>
    </animateMotion>
  </circle>

  <rect x="10" y="222" width="500" height="28" fill="#1a3a2a" rx="4" opacity="0.6"/>
  <text class="mono" x="260" y="239" fill="#c9d1d9" font-size="10" text-anchor="middle">SCANNING  •  8 HOSTS ALIVE  •  23 PORTS OPEN  •  3 SERVICES ENUMERATED</text>
</svg>
