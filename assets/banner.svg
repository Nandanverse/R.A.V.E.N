<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <!-- Background -->
  <rect width="900" height="280" fill="#0a0e17"/>

  <!-- ZONE C: Particles (first = behind everything) -->
  <g>
    <!-- Particle 1: top-left -->
    <circle cx="45" cy="35" r="2" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 12,-8; 0,0" dur="10s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <!-- Particle 2: top margin -->
    <circle cx="180" cy="25" r="1.5" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,10; 0,0" dur="12s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <!-- Particle 3: top-right margin -->
    <circle cx="820" cy="30" r="2.5" fill="#4ecdc4" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-5; 0,0" dur="9s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <!-- Particle 4: left margin -->
    <circle cx="35" cy="140" r="1.5" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-12; 0,0" dur="11s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <!-- Particle 5: right margin -->
    <circle cx="865" cy="150" r="2" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,8; 0,0" dur="13s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <!-- Particle 6: bottom-left -->
    <circle cx="55" cy="250" r="2" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,8; 0,0" dur="9s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <!-- Particle 7: bottom margin -->
    <circle cx="300" cy="255" r="1.5" fill="#3d5a80" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-10; 0,0" dur="14s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="8s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <!-- Particle 8: bottom-right -->
    <circle cx="845" cy="250" r="2.5" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; -14,-6; 0,0" dur="10s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <!-- Particle 9: far left, mid -->
    <circle cx="20" cy="80" r="1.5" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 12,5; 0,0" dur="11s" repeatCount="indefinite" begin="2.4s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite" begin="2.4s"/>
    </circle>
    <!-- Particle 10: far right, mid -->
    <circle cx="880" cy="90" r="2" fill="#3d5a80" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-12; 0,0" dur="12s" repeatCount="indefinite" begin="2.7s"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="7s" repeatCount="indefinite" begin="2.7s"/>
    </circle>
    <!-- Particle 11: top-left area -->
    <circle cx="100" cy="180" r="2" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-14; 0,0" dur="10s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <!-- Particle 12: top-right area -->
    <circle cx="780" cy="180" r="1.5" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,10; 0,0" dur="9s" repeatCount="indefinite" begin="3.3s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite" begin="3.3s"/>
    </circle>
    <!-- Particle 13: center-top (above logo zone) -->
    <circle cx="170" cy="20" r="2.5" fill="#3d5a80" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,8; 0,0" dur="8s" repeatCount="indefinite" begin="3.6s"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite" begin="3.6s"/>
    </circle>
    <!-- Particle 14: center-bottom (below text zone) -->
    <circle cx="600" cy="260" r="2" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-10; 0,0" dur="11s" repeatCount="indefinite" begin="3.9s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite" begin="3.9s"/>
    </circle>
    <!-- Particle 15: left of text zone -->
    <circle cx="320" cy="100" r="1.5" fill="#5c6b73" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-6; 0,0" dur="13s" repeatCount="indefinite" begin="4.2s"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite" begin="4.2s"/>
    </circle>
  </g>

  <!-- ZONE A: Logo glow (behind main logo paths) -->
  <g transform="translate(170, 140)">
    <!-- Glow path 1: head outline -->
    <path d="M -55 -50 Q -30 -90 10 -70 Q 40 -40 50 -10 Q 60 20 40 50 Q 10 70 -20 60 Q -45 45 -55 10 Q -65 -20 -55 -50 Z"
          stroke="#4ecdc4" stroke-width="6" fill="none" opacity="0.08" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Glow path 2: beak -->
    <path d="M 10 -70 Q 30 -95 55 -65 Q 45 -40 25 -45"
          stroke="#4ecdc4" stroke-width="6" fill="none" opacity="0.08" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <!-- Glow path 3: eye ridge -->
    <path d="M -25 -45 Q -10 -65 15 -50 Q 10 -25 -5 -35 Q -20 -30 -30 -40 Z"
          stroke="#4ecdc4" stroke-width="6" fill="none" opacity="0.08" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="4s" repeatCount="indefinite" begin="1s"/>
    </path>
    <!-- Glow path 4: neck -->
    <path d="M -30 50 Q -55 90 -40 130 Q -20 160 20 170"
          stroke="#4ecdc4" stroke-width="6" fill="none" opacity="0.08" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>

  <!-- ZONE A: Logo main paths (always visible) -->
  <g transform="translate(170, 140)">
    <!-- Path 1: head outline -->
    <path d="M -55 -50 Q -30 -90 10 -70 Q 40 -40 50 -10 Q 60 20 40 50 Q 10 70 -20 60 Q -45 45 -55 10 Q -65 -20 -55 -50 Z"
          stroke="#3d5a80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Path 2: beak -->
    <path d="M 10 -70 Q 30 -95 55 -65 Q 45 -40 25 -45"
          stroke="#3d5a80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Path 3: eye ridge -->
    <path d="M -25 -45 Q -10 -65 15 -50 Q 10 -25 -5 -35 Q -20 -30 -30 -40 Z"
          stroke="#3d5a80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Path 4: neck/back -->
    <path d="M -30 50 Q -55 90 -40 130 Q -20 160 20 170"
          stroke="#3d5a80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ZONE B: Separator line (draws in from left) -->
  <line x1="420" y1="135" x2="420" y2="135" stroke="#3d5a80" stroke-width="1" opacity="0.6">
    <animate attributeName="x2" from="420" to="780" dur="1s" begin="0.5s" fill="freeze"/>
  </line>

  <!-- ZONE B: Title text (always visible) -->
  <text x="600" y="120" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#c9d1d9" letter-spacing="8">R.A.V.E.N</text>

  <!-- ZONE B: Subtitle text (always visible) -->
  <text x="600" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#5c6b73" letter-spacing="1">Risk-Aware Autonomous Vulnerability Exploration Network</text>
</svg>
